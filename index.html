<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCP Web</title>
  <meta name="description" content="หน้าทดสอบการ deploy ของ wcp-web บน Vercel">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #5f6672;
      --accent: #2563eb;
      --ok: #16a34a;
      --border: #e3e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b21;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --accent: #60a5fa;
        --ok: #4ade80;
        --border: #2a2f38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--ok);
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent);
    }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { margin: 0 0 20px; color: var(--muted); }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      margin: 0;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    button {
      margin-top: 24px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main class="card">
    <span class="status"><span class="dot"></span> Deploy สำเร็จ</span>
    <h1>WCP Web</h1>
    <p>ถ้าเห็นหน้านี้ แปลว่า repo นี้ deploy ขึ้น Vercel ได้แล้ว</p>

    <dl>
      <dt>โดเมน</dt>
      <dd id="host">-</dd>
      <dt>เวลาที่เปิด</dt>
      <dd id="time">-</dd>
    </dl>

    <button id="btn" type="button">ทดสอบ JavaScript</button>
  </main>

  <script>
    document.getElementById('host').textContent = location.host || '(ไฟล์ในเครื่อง)';
    document.getElementById('time').textContent = new Date().toLocaleString('th-TH');

    let clicks = 0;
    document.getElementById('btn').addEventListener('click', function () {
      clicks += 1;
      this.textContent = 'JavaScript ทำงานได้ (' + clicks + ')';
    });
  </script>
</body>
</html>
